# Luau: highlighting from a Tree-sitter grammar compiled to WebAssembly, and
# luau-lsp, which Flareite runs. The code configures luau-lsp from the
# settings (Roblox's types and docs, which Flareite downloads, or plain
# Luau). In Rojo projects, the Rojo extension keeps the sourcemap.json
# luau-lsp reads. See Flareite's docs/extensions.md#languages.
id = "flareite.luau"
name = "Luau"
version = "0.1.0"
description = "Luau highlighting, and luau-lsp with Roblox's types for diagnostics, hover, definitions, and completion."
author = "Flareite"
icon = "icon.svg"
api_version = "1"
entrypoint = "target/wasm32-unknown-unknown/release/luau.wasm"
activation = ["on-language:luau"]
on_configuration_changed = "flareite.luau.configure"

[engines]
flareite = ">=0.1.0"

# language_servers: luau-lsp.
[permissions]
language_servers = true

[build]
command = "cargo"
args = ["build", "--release"]
watch = ["src", "Cargo.toml"]

[[languages]]
id = "luau"
name = "Luau"
file_extensions = ["luau", "lua"]
grammar = "grammars/tree-sitter-luau.wasm"
highlights = "queries/highlights.scm"
folds = "queries/folds.scm"
# For Toggle Line Comment (Ctrl+/), and `--#region` folding.
line_comment = "--"
block_comment = ["--[[", "]]"]

# .luaurc files are JSON: highlighted by the extension that declares JSON,
# and checked against schemas/luaurc.json below.
[[languages]]
id = "json"
file_names = [".luaurc"]

# Install luau-lsp from https://github.com/JohnnyMorganz/luau-lsp/releases,
# or with Rokit (`rokit add --global JohnnyMorganz/luau-lsp`). These are the
# arguments and settings for the default settings (Roblox, with plugin
# security); the code changes them to match the user's.
[[language_servers]]
name = "luau-lsp"
command = "luau-lsp"
args = [
  "lsp",
  "--definitions:@roblox=${download:https://luau-lsp.pages.dev/type-definitions/globalTypes.PluginSecurity.d.luau}",
  "--docs=${download:https://luau-lsp.pages.dev/api-docs/en-us.json}",
]
languages = ["luau"]
root_markers = [".luaurc", "default.project.json", "rokit.toml", "aftman.toml", "wally.toml"]

[language_servers.settings]
"luau-lsp.platform.type" = "roblox"

[[commands]]
id = "flareite.luau.restartServer"
title = "Restart Language Server"

[[commands]]
id = "flareite.luau.configure"
title = "Apply Settings"
hidden = true

[configuration.platform]
type = "string"
default = "roblox"
choices = ["roblox", "standard"]
description = "What the code runs on: Roblox (with its types, globals, and API docs, which Flareite downloads), or standard Luau."

[configuration.roblox_security_level]
type = "string"
default = "PluginSecurity"
choices = ["None", "LocalUserSecurity", "PluginSecurity", "RobloxScriptSecurity"]
description = "With the Roblox platform: which Roblox APIs to know, by the security level they need. PluginSecurity covers games and plugins."

[[schemas]]
files = [".luaurc"]
path = "schemas/luaurc.json"
